{% extends 'base.html' %}
{% block title %}Kategorie | E-shop{% endblock %}

{% block content %}
<div class="catalog-page">
    <h1 class="catalog-title">Kategorie</h1>

    <div class="product-grid">
        {% for category in categories %}
            <div class="product-card">
                <a href="{% url 'catalog:category_detail' slug=category.slug %}" class="product-image-link">
                    {% if category.image %}
                        <img src="{{ category.image.url }}" alt="{{ category.name }}" class="product-image">
                    {% else %}
                        <img src="https://placehold.co/300x200?text=Kategorie" alt="Bez obrázku" class="product-image">
                    {% endif %}
                </a>
                <h2 class="product-title">
                    <a href="{% url 'catalog:category_detail' slug=category.slug %}">{{ category.name }}</a>
                </h2>
            </div>
        {% empty %}
            <p>Zatím zde nejsou žádné kategorie.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
