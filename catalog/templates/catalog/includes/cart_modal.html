<div id="cart-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 8px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        <p><strong id="modal-product-name"></strong>
        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
            <button id="btn-continue-shopping" class="btn-secondary" style="padding: 8px 16px; cursor: pointer;">Pokračovat v nákupu</button>
            <a href="{% url 'catalog:cart_detail' %}" class="btn-primary" style="display: inline-block; padding: 8px 16px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px;">Přejít do košíku</a>
        </div>
    </div>
</div>
