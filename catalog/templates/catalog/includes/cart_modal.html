{# ---------- CART MODAL ---------- #}
<div id="cart-modal"
     class="modal"
     style="display: none;
     position: fixed;
     top: 0;
     left: 0;
     width: 100%;
     height: 100%;
     background-color: rgba(0,0,0,0.5);
     z-index: 1000;">

    <div class="modal-content">
        <p>
            <strong id="modal-product-name"></strong>
        </p>

        <div class="modal-actions">
            <button id="btn-continue-shopping" class="btn-secondary">
                Pokračovat v nákupu
            </button>

            <a id="btn-go-to-cart" href="{% url 'catalog:cart_detail' %}" class="btn-primary">
                Přejít do košíku
            </a>
        </div>
    </div>
</div>
