{# ---------- OVERSTOCK WARNING ---------- #}
<div class="overstock-warning-box"
     style="background-color: #fff3cd;
     border: 1px solid #ffeeba;
     color: #856404;
     padding: 12px;
     border-radius: 4px;
     margin: 10px 0;">

    <p style="margin: 0 0 8px 0;" class="overstock-text">
        ⚠️ Požadované množství (<span class="qty-val">{{ quantity }}</span> ks) přesahuje skladové zásoby
        (skladem <span class="stock-val">{{ stock }}</span> ks). Dodací lhůta může být prodloužena.
    </p>
    <label style="cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; margin: 0;">
        <input type="checkbox"
               name="overstock_confirmed"
               class="overstock-checkbox"
               value="true"
               {% if product_id %}form="cart-form-{{ product_id }}"{% endif %}>
        Beru na vědomí delší dobu dodání
    </label>
</div>
