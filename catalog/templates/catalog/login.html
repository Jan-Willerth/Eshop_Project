{% extends 'base.html' %}

{% block title %}Přihlášení | E-shop{% endblock %}

{% block content %}
<div class="auth-form">
    <h1>Přihlášení</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Přihlásit se</button>
    </form>

    <p><a href="{% url 'catalog:register' %}" class="btn-primary">Nemám účet – zaregistrovat se</a></p>
</div>
{% endblock %}
