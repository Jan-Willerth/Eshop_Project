{% extends 'base.html' %}

{% block title %}Můj profil | E-shop{% endblock %}

{% block content %}
<div class="auth-form">
    <h1>Můj profil</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Uložit změny</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const companyInvoiceCheckbox = document.getElementById('id_billing_different');
        const companyFields = [
            'id_billing_first_name',
            'id_billing_last_name',
            'id_billing_company_name',
            'id_billing_ico',
            'id_billing_dic',
            'id_billing_street',
            'id_billing_city',
            'id_billing_zip_code'
        ];

        function toggleCompanyFields() {
            companyFields.forEach(function (fieldId) {
                const field = document.getElementById(fieldId);
                if (field) field.closest('p').hidden = !companyInvoiceCheckbox.checked;
            });
        }

        if (companyInvoiceCheckbox) {
            companyInvoiceCheckbox.addEventListener('change', toggleCompanyFields);
            toggleCompanyFields();
        }
    });
</script>
{% endblock %}
