{% extends 'base.html' %}

{% block title %}Můj profil | E-shop{% endblock %}

{% block content %}
<div class="auth-form">
    <h1>Můj profil</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Uložit změny</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        initCompanyBillingToggle('id_billing_different', [
            'id_billing_first_name',
            'id_billing_last_name',
            'id_billing_company_name',
            'id_billing_ico',
            'id_billing_dic',
            'id_billing_street',
            'id_billing_city',
            'id_billing_zip_code'
        ]);
    });
</script>
{% endblock %}
