{% extends 'base.html' %}

{% block title %}Registrace | E-shop{% endblock %}

{% block content %}
<div class="auth-form">
    <h1>Registrace</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Zaregistrovat se</button>
    </form>

    <p><a href="{% url 'catalog:login' %}" class="btn-primary">Už mám účet – přihlásit se</a></p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        initCompanyBillingToggle('id_billing_different', [
            'id_billing_first_name',
            'id_billing_last_name',
            'id_billing_company_name',
            'id_billing_ico',
            'id_billing_dic',
            'id_billing_street',
            'id_billing_city',
            'id_billing_zip_code'
        ]);
    });
</script>
{% endblock %}
