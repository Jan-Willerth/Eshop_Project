{% extends 'base.html' %}

{% block title %}Registrace | E-shop{% endblock %}

{% block content %}
<div class="auth-form">
    <h1>Registrace</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Zaregistrovat se</button>
    </form>

    <p><a href="{% url 'catalog:login' %}" class="btn-primary">Už mám účet – přihlásit se</a></p>
</div>
{% endblock %}
