{% load static %}

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-shop{% endblock %}</title>
</head>
<body>

    <!-- Header & Navigation -->
    <header class="main-header">
        {% include 'navbar.html' %}
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

   <!-- Footer -->
    <footer class="main-footer">
        {% include 'footer.html' %}
    </footer>

    {% include 'catalog/includes/cart_modal.html' %}
    <script src="{% static 'catalog/js/cart.js' %}"></script>
</body>
</html>
